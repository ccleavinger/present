[package]
name = "present-http-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API routes for Present"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
present-domain = { path = "../present-domain" }
present-merge = { path = "../present-merge" }
present-store = { path = "../present-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
