[package]
name = "present-http-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API routes for Present"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
present-domain = { path = "../present-domain" }
present-merge = { path = "../present-merge" }
present-store = { path = "../present-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
parking_lot = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
