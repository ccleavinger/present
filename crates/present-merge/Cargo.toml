[package]
name = "present-merge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Three-way semantic merging for presentation decks"

[dependencies]
git2 = { version = "0.21", default-features = false }
present-domain = { path = "../present-domain" }
present-store = { path = "../present-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
