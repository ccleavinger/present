[workspace]
resolver = "3"
members = [
    "crates/present-domain",
    "crates/present-merge",
    "crates/present-store",
    "crates/present-http-api",
    "crates/server"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true
